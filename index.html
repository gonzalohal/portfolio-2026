<h1>Gonzalo Enrique Hal — Diseñador Multimedial en Mendoza, Argentina</h1>
<p>Diseñador multimedial con 6 años de trayectoria en diseño gráfico, producción audiovisual y modelado 3D. Actualmente a cargo del contenido visual de varias empresas de Gallion Holding, adaptando identidad de marca y línea gráfica a cada una.</p>
<h2>Servicios</h2>
<ul><li>Identidad de marca: registro de marca, manual de identidad y diseño de logotipo</li><li>Diseño gráfico: redes sociales, merchandising, brochures, señalética y campañas impresas</li><li>Producción audiovisual: creación y edición de video en After Effects y Premiere</li><li>Video con inteligencia artificial</li><li>Modelado y renderizado 3D en Blender</li><li>Producto e impresión 3D</li><li>UX / experiencia de usuario y desarrollo web</li><li>Posicionamiento SEO y GEO</li></ul>
<h2>Marcas con las que trabajó</h2>
<p>Gallion Holding, Triunfo Seguros, Lolas Seguras, MediLine, NSA Seguros, Auxilio24, Televet, Travel Express, BLACkIA.</p>
<h2>Contacto</h2>
<p>Mendoza, Argentina · <a href="mailto:Gonzalohal@gmail.com">Gonzalohal@gmail.com</a> · <a href="https://linkedin.com/in/gonzalo-hal">LinkedIn</a> · <a href="https://sketchfab.com/gonzalohal">Modelos 3D en Sketchfab</a></p>
<p>Este portfolio necesita JavaScript para mostrar los trabajos.</p>
