<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gonzalo Hal — Diseñador Multimedial</title>
<meta name="description" content="Portfolio de Gonzalo Hal, diseñador multimedial en Mendoza, Argentina. Identidad de marca, diseño gráfico, producción audiovisual, modelado 3D y video con IA.">
<link rel="icon" href="images/site/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= NAV ================= -->
<div class="nav-wrap">
  <nav class="nav" id="nav">
    <a href="#top" class="nav-logo" id="navLogo">Gonzalo<span>.</span>Hal</a>
    <ul class="nav-links">
      <li><a href="#sobre-mi">Sobre mí</a></li>
      <li><a href="#servicios">Servicios</a></li>
      <li><a href="#trabajos">Trabajos</a></li>
      <li><a href="#experiencia">Experiencia</a></li>
    </ul>
    <div class="nav-cta">
      <a href="#contacto" class="btn btn-ghost btn-sm" id="navContactLabel">Contacto</a>
      <a href="assets/CV-Gonzalo-Hal.pdf" class="btn btn-primary btn-sm" id="navCvLink" download>Descargar CV</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </nav>
</div>

<div class="mobile-menu" id="mobileMenu">
  <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Cerrar menú">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <ul>
    <li><a href="#sobre-mi">Sobre mí</a></li>
    <li><a href="#servicios">Servicios</a></li>
    <li><a href="#trabajos">Trabajos</a></li>
    <li><a href="#experiencia">Experiencia</a></li>
    <li><a href="#contacto">Contacto</a></li>
  </ul>
  <a href="assets/CV-Gonzalo-Hal.pdf" class="btn btn-primary" id="mobileCvLink" download>Descargar CV</a>
</div>

<!-- ================= HERO ================= -->
<header class="hero" id="top">
  <div class="hero-inner reveal">
    <div class="hero-copy">
      <span class="eyebrow" id="heroEyebrow"></span>
      <h1 id="heroHeadline"></h1>
      <p class="hero-sub" id="heroSub"></p>
      <div class="hero-cta">
        <a href="#trabajos" class="btn btn-primary" id="heroCtaPrimary"></a>
        <a href="#contacto" class="btn btn-ghost" id="heroCtaSecondary"></a>
      </div>
      <div class="hero-meta" id="heroStats"></div>
    </div>
    <div class="hero-visual" id="heroVisual" aria-hidden="true">
      <span class="hv-ring"></span>
      <span class="hv-shape hv-1"><span class="hv-mono">Ai</span></span>
      <span class="hv-shape hv-2"><span class="hv-mono">Ae</span></span>
      <span class="hv-shape hv-3">
        <svg class="hv-icon" viewBox="0 0 100 100" fill="none">
          <g stroke="#FBF0E4" stroke-width="9" stroke-linecap="round">
            <line x1="50" y1="50" x2="50" y2="5"/>
            <line x1="50" y1="50" x2="72" y2="11.9"/>
            <line x1="50" y1="50" x2="81.2" y2="32"/>
            <line x1="50" y1="50" x2="95" y2="50"/>
            <line x1="50" y1="50" x2="86.4" y2="71"/>
            <line x1="50" y1="50" x2="71.5" y2="87.2"/>
            <line x1="50" y1="50" x2="50" y2="84"/>
            <line x1="50" y1="50" x2="37" y2="72.5"/>
            <line x1="50" y1="50" x2="18" y2="68.5"/>
            <line x1="50" y1="50" x2="5" y2="50"/>
            <line x1="50" y1="50" x2="13.6" y2="29"/>
            <line x1="50" y1="50" x2="30" y2="15.4"/>
          </g>
        </svg>
      </span>
      <span class="hv-shape hv-4"><span class="hv-mono">Ps</span></span>
      <span class="hv-shape hv-5">
        <svg class="hv-icon" viewBox="0 0 38 57" fill="none">
          <path d="M0 9.5C0 4.253 4.253 0 9.5 0H19V19H9.5C4.253 19 0 14.747 0 9.5Z" fill="#F24E1E"/>
          <path d="M19 0H28.5C33.747 0 38 4.253 38 9.5C38 14.747 33.747 19 28.5 19H19V0Z" fill="#FF7262"/>
          <path d="M0 28.5C0 23.253 4.253 19 9.5 19H19V38H9.5C4.253 38 0 33.747 0 28.5Z" fill="#A259FF"/>
          <path d="M19 28.5C19 23.253 23.253 19 28.5 19C33.747 19 38 23.253 38 28.5C38 33.747 33.747 38 28.5 38C23.253 38 19 33.747 19 28.5Z" fill="#1ABCFE"/>
          <path d="M0 47.5C0 42.253 4.253 38 9.5 38H19V57H9.5C4.253 57 0 52.747 0 47.5Z" fill="#0ACF83"/>
        </svg>
      </span>
      <span class="hv-dot hv-d1"></span>
      <span class="hv-dot hv-d2"></span>
      <span class="hv-dot hv-d3"></span>
    </div>
  </div>

  <div class="ticker" aria-hidden="true">
    <div class="ticker-track" id="heroTicker"></div>
  </div>
</header>

<!-- ================= CLIENTS ================= -->
<div class="clients reveal">
  <div class="clients-inner" id="clientsInner"></div>
</div>

<!-- ================= SOBRE MI ================= -->
<section id="sobre-mi">
  <div class="about reveal">
    <div class="inner about-grid">
      <div class="about-photo">
        <img src="images/site/gonzalo.jpg" alt="Gonzalo Hal" id="aboutPhoto">
      </div>
      <div class="about-text">
        <span class="eyebrow">Sobre mí</span>
        <div id="aboutParagraphs" style="margin-top:18px;"></div>
        <div class="skill-pills" id="aboutSkills"></div>
        <dl class="about-facts" id="aboutFacts"></dl>
      </div>
    </div>
  </div>
</section>

<!-- ================= SERVICIOS ================= -->
<section id="servicios">
  <div class="inner">
    <div class="section-head reveal">
      <div>
        <span class="eyebrow" id="servicesEyebrow"></span>
        <h2 id="servicesTitle"></h2>
      </div>
      <p id="servicesSub"></p>
    </div>

    <div class="services-grid" id="servicesGrid"></div>
  </div>
</section>

<!-- ================= TRABAJOS ================= -->
<section id="trabajos">
  <div class="inner">
    <div class="section-head reveal">
      <div>
        <span class="eyebrow" id="workEyebrow"></span>
        <h2 id="workTitle"></h2>
      </div>
      <p id="workSub"></p>
    </div>

    <div class="work-filters reveal">
      <button class="filter-btn is-active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="branding">Identidad de Marca</button>
      <button class="filter-btn" data-filter="grafica">Gráfica &amp; Redes</button>
      <button class="filter-btn" data-filter="audiovisual">Audiovisual</button>
      <button class="filter-btn" data-filter="merch">Merchandising &amp; Señalética</button>
      <button class="filter-btn" data-filter="3d">Modelado 3D</button>
    </div>

    <div class="work-grid" id="workGrid"></div>
    <div class="work-more" id="workMore" hidden>
      <button class="btn btn-ghost" id="workMoreBtn">Ver más</button>
    </div>
  </div>
</section>

<!-- ================= EXPERIENCIA ================= -->
<section id="experiencia">
  <div class="inner exp-grid">
    <div>
      <div class="section-head reveal" style="margin-bottom:36px;">
        <div>
          <span class="eyebrow" id="expEyebrow"></span>
          <h2 id="expTitle"></h2>
        </div>
      </div>
      <div class="timeline reveal" id="timelineList"></div>
    </div>

    <div>
      <div class="section-head reveal" style="margin-bottom:36px;">
        <div>
          <span class="eyebrow" id="eduEyebrow"></span>
          <h2 id="eduTitle"></h2>
        </div>
      </div>
      <div class="edu-list reveal" id="eduList"></div>
    </div>
  </div>
</section>

<!-- ================= CONTACTO ================= -->
<section id="contacto">
  <div class="contact reveal">
    <span class="eyebrow" style="color:#cfced8;" id="contactEyebrow"></span>
    <h2 style="margin-top:16px;" id="contactTitle"></h2>
    <p id="contactSub"></p>
    <div class="contact-cta">
      <a href="#" class="btn btn-accent" id="contactEmailBtn">Enviar un email</a>
      <a href="#" class="btn btn-ghost" id="contactWhatsappBtn" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    <div class="contact-links">
      <a href="#" id="contactEmailText"></a>
      <a href="#" id="contactPhoneText"></a>
      <a href="#" id="contactLinkedin" target="_blank" rel="noopener">LinkedIn</a>
      <a href="#" id="contactSketchfab" target="_blank" rel="noopener">Sketchfab</a>
    </div>
  </div>
</section>

<footer>
  <span id="footerText">© <span id="year"></span></span>
</footer>

<a href="#top" class="scroll-top-btn" id="scrollTopBtn" aria-label="Volver arriba">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</a>

<!-- ================= MODAL ================= -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="modal-hero"><img id="modalHeroImg" src="" alt=""></div>
    <div class="modal-body">
      <span class="tag" id="modalTag"></span>
      <h3 id="modalTitle"></h3>
      <p class="desc" id="modalDesc"></p>
      <div class="modal-strip" id="modalStrip"></div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
